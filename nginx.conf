server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # Les blocs `location ~*` passent avant `location /` : les images, le CSS
    # et le JS sont donc traités par leurs règles, tout le reste — les pages —
    # tombe dans `location /`.

    # Portraits et captures : noms stables, contenu figé entre deux mises en
    # ligne. `expires` émet déjà un Cache-Control, inutile d'en ajouter un.
    location ~* \.(?:jpg|jpeg|png|gif|svg|webp|ico|woff2?)$ {
        expires 7d;
    }

    # styles.css et script.js ne portent pas d'empreinte de version : sans
    # revalidation, un visiteur déjà venu garderait l'ancienne feuille de
    # style après un déploiement.
    location ~* \.(?:css|js)$ {
        add_header Cache-Control "no-cache";
    }

    # Site multipage, pas une SPA : une URL inconnue doit répondre 404. Le
    # modèle d'origine renvoyait /index.html, ce qui aurait servi l'accueil
    # avec un code 200 sur un /programm mal orthographié — invisible pour le
    # visiteur, et Google aurait indexé l'accueil sous chaque faute de frappe.
    # $uri.html accepte /programme aussi bien que /programme.html.
    location / {
        try_files $uri $uri/ $uri.html =404;
        add_header Cache-Control "no-cache";
    }
}
